name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.8
          tofu_wrapper: false

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      # Runs against a mocked provider, so no Google Cloud credentials are
      # needed. Requires OpenTofu >= 1.7 for `mock_provider`.
      - name: test
        run: tofu test

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate
